name: Compatibility or usability report
description: Report a browser, server, or form that behaves unexpectedly.
body:
  - type: markdown
    attributes:
      value: Use a disposable account and made-up values. Keep passwords, vault exports, tokens, private server addresses, and screenshots of real items out of public reports. For a security issue, see SECURITY.md.
  - type: input
    id: versions
    attributes:
      label: Vibepass, browser, and server versions
      placeholder: Vibepass version or commit, browser version, Bitwarden or Vaultwarden version
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps, expected result, and actual result
      description: For autofill, include a public page URL or a small sanitized form with its labels and autocomplete attributes.
    validations:
      required: true
